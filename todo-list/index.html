<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h2>Todo List 👩🏻‍💻</h2>
            <p>Günlük not defteri</p>
            <div class="quick-add-container">
                <form id="quick-add-form">
                    <input type="text" id="add-input" placeholder="Görev ekle..." required>
                    <button type="submit" id="add-input-btn">+ Görev Ekle</button>
                    <button type="button" id="open-details-btn" class="btn-primary"> + Detaylı Görev Ekle</button>
                </form>
            </div>
        </header>

        <main class="content">
            <aside class="filters-sidebar">
                <section class="filter-group">
                    <h3>Filtreler & Sıralama</h3><br>
                    
                    <div class="input-group">
                        <label for="search-input">Ara:</label>
                        <input type="text" id="search-input" placeholder="Görevlerde ara...">
                    </div>

                    <div class="input-group">
                        <label for="category-filter">Kategori:</label>
                        <select id="category-filter">
                            <option value="all">Tüm Kategoriler</option>
                            </select>
                    </div>

                    <div class="input-group">
                        <label for="status-filter">Durum:</label>
                        <select id="status-filter">
                            <option value="all" selected>Hepsi</option>
                            <option value="active">Aktif</option>
                            <option value="completed">Tamamlanan</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="sort-select">Sıralama:</label>
                        <select id="sort-select">
                            <option value="date-desc">Tarih (Yeni -> Eski)</option>
                            <option value="date-asc">Tarih (Eski -> Yeni)</option>
                            <option value="alpha-asc">İsim (A -> Z)</option>
                            <option value="alpha-desc">İsim (Z -> A)</option>
                        </select>
                    </div>
                </section>
            </aside>

            <!-- bu kısım görevlerin gösterileceği kısım, görevlerin buraya gelmesi için oluşturulmuş bir alandır. -->
            <section class="todo-list-container">
                <div id="todo-list" class="task-grid">
                    </div>
            </section>
        </main>
    </div>

    <dialog id="detailed-modal">
    <div class="modal-content">
        <h3 id="modal-title">Yeni Detaylı Görev</h3>
        <form id="detailed-add-form">
            <label>Görev:</label>
            <input type="text" id="det-title" required>

            <label>Kategori:</label>
            <input type="text" id="det-category"> 

            <div class="date-group">
                <label>Başlangıç:</label>
                <input id="det-starting" type="datetime-local" required>
                <label>Bitiş:</label>
                <input id="det-ending" type="datetime-local" required>
            </div>

            <div class="modal-actions">
                <button type="button" id="close-modal-btn">İptal</button>
                <button type="submit" id="submit-modal-btn">Kaydet</button>
            </div>
        </form>
    </div>
</dialog>

    <script src="script.js"></script>
</body>
</html>
